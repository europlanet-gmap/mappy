
[project]
name = "mappy"
version = "0.4.0"
description = ""
authors = [
    {name = "Luca Penasa", email = "luca.penasa@gmail.com"}
]
requires-python = ">=3.11.0,<4.0"

# these deps are used for development and testing, not for the plugin itself
dependencies = [
    "Sphinx>=5.1.1,<6.0.0",
    "sphinx-autobuild>=2021.3.14",
    "myst-parser>=0.18.0,<0.19.0",
    "sphinx-rtd-theme>=1.0.0,<2.0.0",
    "pytest-order>=1.0.1,<2.0.0",
    "pytest-dependency>=0.5.1,<0.6.0",
    "Markdown>=3.4.1,<4.0.0",
    "pb-tool>=3.1.0,<4.0.0",
    "sphinxcontrib-bibtex>=2.4.2,<3.0.0",
    "python-kacl>=0.7.0,<0.8.0",
    "numpy>=2.4.6",
    "qgis-stubs>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
