# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tagged Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-24.04

    env:
      # Pin uv to the system interpreter for every uv command in this job:
      # left to its own preference, uv happily downloads and uses its own
      # managed CPython build instead of the system interpreter
      # python3-qgis actually installed into, silently pointing
      # --system-site-packages at the wrong (empty) site-packages
      # directory -- confirmed locally in Docker, where the initial
      # `uv venv --python ...` correctly picked the system interpreter but
      # a later bare `uv sync` silently re-resolved and recreated the venv
      # against its own downloaded build instead. Job-level (not just the
      # install step) so it also covers the later `uv run just test` /
      # `uv run just package` steps.
      UV_PYTHON: /usr/bin/python3

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Fail fast (before the slow apt install) if the tag was pushed without
    # bumping the version first -- otherwise the release would ship a zip
    # whose metadata.txt tells QGIS it is still the previous version.
    # `just bump` keeps all three in sync.
    - name: Check tag matches the plugin version
      run: |
        tag="${GITHUB_REF_NAME#v}"
        metadata=$(sed -n 's/^version=//p' mappy/metadata.txt)
        project=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
        echo "tag=$tag metadata.txt=$metadata pyproject.toml=$project"
        if [ "$tag" != "$metadata" ] || [ "$tag" != "$project" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match the version in mappy/metadata.txt ($metadata) / pyproject.toml ($project). Use 'just bump' to create release tags."
          exit 1
        fi

    - name: Install system deps (qgis)
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-qgis pyqt5-dev-tools

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install just
      uses: extractions/setup-just@v4

    - name: Install Python dependencies
      run: |
        # --system-site-packages so the venv can see the apt-installed qgis
        # bindings; plain `pip install` would otherwise fail on Ubuntu 24.04's
        # PEP 668 "externally-managed-environment" system Python.
        uv venv --system-site-packages
        uv sync

    - name: Lint and format-check with ruff
      run: |
        uv run ruff check mappy scripts
        uv run ruff format --check mappy scripts

    - name: Test with pytest
      run: uv run just test

    # VERSION passed explicitly rather than left to the justfile's
    # `git describe`, which could pick a different tag if several point at
    # this commit -- the zip name has to match `files:` below exactly.
    - name: Create package
      run: uv run just VERSION=${{ github.ref_name }} package

    # The released version's CHANGELOG.md section (minus its own heading,
    # the release title already names the version). kacl-cli exits non-zero
    # if the section is missing, failing the release before it is created.
    - name: Extract release notes
      run: |
        set -o pipefail
        uv run kacl-cli get "${GITHUB_REF_NAME#v}" | tail -n +2 > release-notes.md

    - uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: mappy ${{ github.ref_name }}
        body_path: release-notes.md
        generate_release_notes: true
        prerelease: false
        make_latest: true
        fail_on_unmatched_files: true
        files: mappy/zip_build/mappy-${{ github.ref_name }}.zip
