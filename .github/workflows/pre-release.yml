# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Pre Release

on:
  push:
    branches: [ master ]
    tags-ignore:
      - "*"
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-24.04

    env:
      # Pin uv to the system interpreter for every uv command in this job:
      # left to its own preference, uv happily downloads and uses its own
      # managed CPython build instead of the system interpreter
      # python3-qgis actually installed into, silently pointing
      # --system-site-packages at the wrong (empty) site-packages
      # directory -- confirmed locally in Docker, where the initial
      # `uv venv --python ...` correctly picked the system interpreter but
      # a later bare `uv sync` silently re-resolved and recreated the venv
      # against its own downloaded build instead. Job-level (not just the
      # install step) so it also covers the later `uv run just test` /
      # `uv run just package` steps.
      UV_PYTHON: /usr/bin/python3

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install system deps (qgis)
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-qgis pyqt5-dev-tools

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install just
      uses: extractions/setup-just@v4

    - name: Install Python dependencies
      run: |
        # --system-site-packages so the venv can see the apt-installed qgis
        # bindings; plain `pip install` would otherwise fail on Ubuntu 24.04's
        # PEP 668 "externally-managed-environment" system Python.
        uv venv --system-site-packages
        uv sync

    - name: Lint and format-check with ruff
      run: |
        uv run ruff check mappy scripts
        uv run ruff format --check mappy scripts

    - name: Test with pytest
      run: uv run just test

    - name: Create package
      if: github.event_name == 'push'
      run: |
        uv run just package
        cp mappy/zip_build/mappy-*.zip mappy/zip_build/mappy-latest.zip

    - uses: softprops/action-gh-release@v3
      if: github.event_name == 'push'
      with:
        tag_name: "latest"
        prerelease: true
        files: mappy/zip_build/mappy-latest.zip
